<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zak muse - Edit Playlist</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body class="dark-theme">
    <header>
      <a href="../index.html" class="logo">Zak muse</a>
      <nav>
        <ul>
          <li><a href="../index.html">Home</a></li>
          <li><a href="login.html">Logout</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <div class="edit-playlist-header">
        <h2>Edit Playlist: Best of Indie</h2>
        <a href="watch.html" class="btn-secondary btn-link">View Playlist</a>
      </div>

      <div class="edit-grid">
        <section>
          <div class="form-container full-width">
            <h3>Playlist Details</h3>
            <form>
              <div class="form-group">
                <label for="playlist-name">Playlist Name</label>
                <input type="text" id="playlist-name" value="Best of Indie" />
              </div>
              <div class="form-group">
                <label for="playlist-desc">Description</label>
                <textarea id="playlist-desc" rows="4">A collection of the finest indie tracks for your soul. Curated by the community.</textarea>
              </div>
              <div class="form-group">
                <label for="playlist-privacy">Privacy</label>
                <select id="playlist-privacy">
                  <option value="public" selected>Public</option>
                  <option value="private">Private</option>
                  <option value="collaborative">Collaborative</option>
                </select>
              </div>
              <div class="form-actions">
                <button type="submit" class="btn-primary">Save Changes</button>
                <button type="button" class="btn-danger">Delete Playlist</button>
              </div>
            </form>
          </div>
        </section>

        <section class="admin-panel">
          <div class="heder">
            <h3>Manage Tracks</h3>
            <button class="btn-primary">Add Track</button>
          </div>
          <div class="user-table-container">
            <table>
              <thead>
                <tr>
                  <th>Order</th>
                  <th>Title</th>
                  <th>Artist</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>1</td>
                  <td>Walking on a Dream</td>
                  <td>Empire of the Sun</td>
                  <td class="actions">
                    <button class="btn-secondary">Move Up</button>
                    <button class="btn-danger">Remove</button>
                  </td>
                </tr>
                <tr>
                  <td>2</td>
                  <td>Midnight City</td>
                  <td>M83</td>
                  <td class="actions">
                    <button class="btn-secondary">Move Up</button>
                    <button class="btn-danger">Remove</button>
                  </td>
                </tr>
                <tr>
                  <td>3</td>
                  <td>The Less I Know The Better</td>
                  <td>Tame Impala</td>
                  <td class="actions">
                    <button class="btn-secondary">Move Up</button>
                    <button class="btn-danger">Remove</button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </main>

    <footer>
      <p>&copy; 2026 Zak muse - Built for Variant 9. Web Development Lab.</p>
    </footer>
  </body>
</html>
