<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zak muse - Login</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body class="dark-theme">
    <header>
      <a href="../index.html" class="logo">Zak muse</a>
      <nav>
        <ul>
          <li><a href="../index.html">Home</a></li>
          <li><a href="login.html" class="active">Login</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <div class="form-container">
        <h2>Author Login</h2>
        <form action="admin_users.html">
          <div class="form-group">
            <label for="username">Username</label>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="Enter your username"
            />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
            />
          </div>
          <div class="form-actions">
            <button type="submit" class="btn-primary">Login</button>
            <button type="button" class="btn-secondary">Forgot?</button>
          </div>
        </form>
      </div>
    </main>

    <footer>
      <p>&copy; 2026 Zak muse - Built for Variant 9. Web Development Lab.</p>
    </footer>
  </body>
</html>
